id = "slatkin.prompt-dock"
name = "Prompt Dock"
version = "0.3.0"
min_luvus_version = "0.14.3"
description = "A sidebar dock for a hierarchical markdown prompt library: browse, edit, and send prompts to agents."

# The dock luvus reserves for this module. The module fills it with `ui dock
# push`; luvus owns the rendering and the user can move it from Settings -> Layout.
[[docks]]
id = "prompts"
title = "PROMPTS"
placement = "sidebar.left"

# Build the binary at git-install time. For a linked checkout, run
# `go install ./cmd/prompt-dock` by hand (see README).
[[build]]
command = ["go", "install", "./cmd/prompt-dock"]

# Repaint the dock after a restart (dock contents are not persisted).
[[startup]]
command = ["prompt-dock", "refresh"]

# Keep the dock and its send targets fresh.
[[events]]
on = "workspace.created"
command = ["prompt-dock", "refresh"]

[[events]]
on = "workspace.closed"
command = ["prompt-dock", "refresh"]

[[events]]
on = "pane.created"
command = ["prompt-dock", "refresh"]

[[events]]
on = "pane.closed"
command = ["prompt-dock", "refresh"]

[[events]]
on = "pane.agent_status_changed"
command = ["prompt-dock", "refresh"]

# All actions run from dock rows and row menus; none take right-click contexts.
# Left-click is select (a prompt) or toggle (a folder); opening a file is a row
# menu choice, so it never competes with a plain click. The verb picks the edit
# mode, so no action-id indirection is needed.
[[actions]]
id = "refresh"
title = "Refresh prompts"
command = ["prompt-dock", "refresh"]

[[actions]]
id = "toggle"
title = "Expand or collapse folder"
command = ["prompt-dock", "toggle"]

[[actions]]
id = "select"
title = "Select prompt"
command = ["prompt-dock", "select"]

[[actions]]
id = "edit-inline"
title = "Edit prompt inline"
command = ["prompt-dock", "edit-inline"]

[[actions]]
id = "edit-external"
title = "Edit prompt in external editor"
command = ["prompt-dock", "edit-external"]

[[actions]]
id = "send"
title = "Send prompt to agent"
command = ["prompt-dock", "send"]

[[settings]]
key = "root"
title = "Prompt library root"
type = "string"
default = "~/.prompts"
